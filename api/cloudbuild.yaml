steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        'build',
        '-f',
        'api/Dockerfile',
        '-t',
        'us-central1-docker.pkg.dev/$PROJECT_ID/xavier-db/streamlit:$COMMIT_SHA',
        'streamlit'
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/bigquery-kco/xavier-db/api:$COMMIT_SHA"
      ]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "xavier-db-dev",
        "--image",
        "us-central1-docker.pkg.dev/bigquery-kco/xavier-db/api:$COMMIT_SHA",
        "--region",
        "us-central1",
        "--platform",
        "managed"
      ]

options:
  logging: CLOUD_LOGGING_ONLY