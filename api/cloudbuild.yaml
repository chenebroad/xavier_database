steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "us-central1-docker.pkg.dev/bigquery-kco/xavier-db/api:$COMMIT_SHA",
        "."
      ]

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/bigquery-kco/xavier-db/api:$COMMIT_SHA"
      ]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "xavier-db-dev",
        "--image",
        "us-central1-docker.pkg.dev/bigquery-kco/xavier-db/api:$COMMIT_SHA",
        "--region",
        "us-central1",
        "--platform",
        "managed"
      ]